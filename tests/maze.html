<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notebook Nightmare</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d0d;
    color: #eee;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #hud {
    display: flex;
    gap: 30px;
    margin-bottom: 10px;
    font-size: 18px;
  }
  #hud span { color: #ffcc00; }
  canvas {
    background: #111;
    border: 3px solid #444;
    box-shadow: 0 0 30px rgba(255,204,0,0.15);
  }
  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
  }
  #overlay h1 {
    font-size: 48px;
    margin-bottom: 10px;
  }
  #overlay.caught h1 { color: #ff3b3b; text-shadow: 0 0 20px #ff3b3b; }
  #overlay.win h1 { color: #4dff88; text-shadow: 0 0 20px #4dff88; }
  #overlay p { color: #aaa; margin-bottom: 20px; }
  button {
    background: #ffcc00;
    border: none;
    padding: 12px 24px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    font-family: inherit;
  }
  button:hover { background: #ffdd44; }
  #info {
    margin-top: 10px;
    color: #666;
    font-size: 13px;
  }
</style>
</head>
<body>

<div id="hud">
  <div>Notebooks: <span id="score">0</span> / <span id="total">7</span></div>
  <div>Chaser speed: <span id="speedDisplay">1.0x</span></div>
</div>

<canvas id="game" width="560" height="560"></canvas>
<div id="info">WASD or Arrow Keys to move — collect all notebooks, avoid the Principal!</div>

<div id="overlay">
  <h1 id="overlayTitle"></h1>
  <p id="overlayText"></p>
  <button onclick="restartGame()">Try Again</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const COLS = 14, ROWS = 14;
const CELL = canvas.width / COLS;

// 1 = wall, 0 = open
// Generate maze using randomized DFS
function generateMaze(cols, rows) {
  const grid = Array.from({length: rows}, () => Array(cols).fill(1));

  function carve(cx, cy) {
    const dirs = [[0,-2],[0,2],[-2,0],[2,0]];
    dirs.sort(() => Math.random() - 0.5);
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && grid[ny][nx] === 1) {
        grid[cy + dy/2][cx + dx/2] = 0;
        grid[ny][nx] = 0;
        carve(nx, ny);
      }
    }
  }

  grid[1][1] = 0;
  carve(1, 1);

  // open up a few extra passages so it's not too maze-like / has loops
  for (let i = 0; i < Math.floor(cols * rows * 0.04); i++) {
    const rx = 1 + Math.floor(Math.random() * (cols - 2));
    const ry = 1 + Math.floor(Math.random() * (rows - 2));
    grid[ry][rx] = 0;
  }

  return grid;
}

let maze, player, chaser, notebooks, collected, chaserSpeed, gameOver, moveTimer;
let chaserMoveInterval;

const BASE_INTERVAL = 320; // ms per chaser step at 1x speed

function openCells() {
  const cells = [];
  for (let y = 1; y < ROWS - 1; y++) {
    for (let x = 1; x < COLS - 1; x++) {
      if (maze[y][x] === 0) cells.push({x, y});
    }
  }
  return cells;
}

function dist(a, b) {
  return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
}

function initGame() {
  maze = generateMaze(COLS, ROWS);
  const cells = openCells();

  player = {x: 1, y: 1};

  // place chaser far from player
  let candidates = cells.filter(c => dist(c, player) > 8);
  chaser = candidates.length ? {...candidates[Math.floor(Math.random() * candidates.length)]} : {...cells[cells.length - 1]};

  // place notebooks on random open cells, not too close to player
  notebooks = [];
  const notebookCandidates = cells.filter(c => dist(c, player) > 2 && !(c.x === chaser.x && c.y === chaser.y));
  notebookCandidates.sort(() => Math.random() - 0.5);
  const total = Math.min(7, notebookCandidates.length);
  for (let i = 0; i < total; i++) notebooks.push(notebookCandidates[i]);

  collected = 0;
  chaserSpeed = 1.0;
  gameOver = false;
  document.getElementById('score').textContent = collected;
  document.getElementById('total').textContent = notebooks.length;
  document.getElementById('speedDisplay').textContent = chaserSpeed.toFixed(1) + 'x';
  document.getElementById('overlay').style.display = 'none';

  if (chaserMoveInterval) clearInterval(chaserMoveInterval);
  scheduleChaser();
}

function scheduleChaser() {
  if (chaserMoveInterval) clearInterval(chaserMoveInterval);
  chaserMoveInterval = setInterval(moveChaser, BASE_INTERVAL / chaserSpeed);
}

// BFS pathfinding for chaser toward player
function bfsNextStep(from, to) {
  const key = (x, y) => x + ',' + y;
  const visited = new Set([key(from.x, from.y)]);
  const queue = [[from.x, from.y, []]];
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];

  while (queue.length) {
    const [cx, cy, path] = queue.shift();
    if (cx === to.x && cy === to.y) {
      return path.length ? path[0] : {x: cx, y: cy};
    }
    for (const [dx, dy] of dirs) {
      const nx = cx + dx, ny = cy + dy;
      if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) continue;
      if (maze[ny][nx] === 1) continue;
      const k = key(nx, ny);
      if (visited.has(k)) continue;
      visited.add(k);
      queue.push([nx, ny, [...path, {x: nx, y: ny}]]);
    }
  }
  return null;
}

function moveChaser() {
  if (gameOver) return;
  const next = bfsNextStep(chaser, player);
  if (next) {
    chaser.x = next.x;
    chaser.y = next.y;
  }
  if (chaser.x === player.x && chaser.y === player.y) {
    triggerGameOver(false);
  }
  draw();
}

function tryMovePlayer(dx, dy) {
  if (gameOver) return;
  const nx = player.x + dx, ny = player.y + dy;
  if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return;
  if (maze[ny][nx] === 1) return;
  player.x = nx;
  player.y = ny;

  // check notebook pickup
  const idx = notebooks.findIndex(n => n.x === nx && n.y === ny && !n.collected);
  if (idx !== -1) {
    notebooks[idx].collected = true;
    collected++;
    document.getElementById('score').textContent = collected;
    chaserSpeed += 0.18;
    document.getElementById('speedDisplay').textContent = chaserSpeed.toFixed(1) + 'x';
    scheduleChaser();

    if (collected >= notebooks.length) {
      triggerGameOver(true);
    }
  }

  // check collision with chaser
  if (player.x === chaser.x && player.y === chaser.y) {
    triggerGameOver(false);
  }

  draw();
}

function triggerGameOver(won) {
  gameOver = true;
  if (chaserMoveInterval) clearInterval(chaserMoveInterval);
  const overlay = document.getElementById('overlay');
  overlay.className = won ? 'win' : 'caught';
  overlay.style.display = 'flex';
  document.getElementById('overlayTitle').textContent = won ? 'You collected them all!' : 'The Principal got you!';
  document.getElementById('overlayText').textContent = won
    ? 'Every notebook found. Nice work.'
    : 'Caught in the halls. Better luck next time.';
}

function restartGame() {
  initGame();
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // maze walls
  ctx.fillStyle = '#2a2a2a';
  for (let y = 0; y < ROWS; y++) {
    for (let x = 0; x < COLS; x++) {
      if (maze[y][x] === 1) {
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }

  // notebooks
  ctx.fillStyle = '#ffcc00';
  notebooks.forEach(n => {
    if (n.collected) return;
    const cx = n.x * CELL + CELL / 2;
    const cy = n.y * CELL + CELL / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillRect(-CELL * 0.22, -CELL * 0.28, CELL * 0.44, CELL * 0.56);
    ctx.strokeStyle = '#665500';
    ctx.lineWidth = 2;
    ctx.strokeRect(-CELL * 0.22, -CELL * 0.28, CELL * 0.44, CELL * 0.56);
    ctx.restore();
  });

  // chaser
  ctx.fillStyle = '#ff3b3b';
  ctx.beginPath();
  ctx.arc(chaser.x * CELL + CELL/2, chaser.y * CELL + CELL/2, CELL * 0.38, 0, Math.PI * 2);
  ctx.fill();

  // player
  ctx.fillStyle = '#4da6ff';
  ctx.beginPath();
  ctx.arc(player.x * CELL + CELL/2, player.y * CELL + CELL/2, CELL * 0.34, 0, Math.PI * 2);
  ctx.fill();
}

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (['w','arrowup'].includes(key)) tryMovePlayer(0, -1);
  else if (['s','arrowdown'].includes(key)) tryMovePlayer(0, 1);
  else if (['a','arrowleft'].includes(key)) tryMovePlayer(-1, 0);
  else if (['d','arrowright'].includes(key)) tryMovePlayer(1, 0);
});

initGame();
draw();
</script>

</body>
</html>
